<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0b1026" />
<title>Sketchy Skier 涂鸦滑雪</title>
<style>
:root{ --bg:#0b1026; --panel:#141b3d; --accent:#5ee7ff; --pink:#ff6ec7; }
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--bg);color:#fff;
 font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
 touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none;}
canvas{display:block;}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;z-index:10;}
[hidden]{display:none !important;}
#drawScreen{background:linear-gradient(180deg,#1668e8 0%,#3f97ff 45%,#9fd0ff 78%,#dceeff 100%);}
h1.title{margin:0;font-size:42px;font-weight:900;font-style:italic;letter-spacing:1px;text-align:center;color:#fff;
 text-shadow:0 3px 0 #0d47b8,0 8px 22px rgba(0,40,120,.45);}
h1.title .en{display:block;font-size:16px;font-style:normal;letter-spacing:6px;color:#ffd93b;margin-top:8px;text-shadow:0 2px 0 #a86a00;}
#drawScreen .sub{color:#eaf4ff;text-shadow:0 1px 6px rgba(0,60,140,.5);}
.btn.big{font-size:22px;padding:16px 62px;color:#3a2600;font-weight:900;
 background:linear-gradient(180deg,#ffd93b,#ffb800);box-shadow:0 6px 0 #b87a00,0 12px 26px rgba(0,40,120,.35);}
.btn.big:active{transform:translateY(4px);box-shadow:0 2px 0 #b87a00,0 6px 14px rgba(0,40,120,.3);}
.sub{color:#9aa7d0;font-size:14px;margin:0;text-align:center;}
#drawCanvas{width:min(84vw,340px);aspect-ratio:1/1;border-radius:18px;background:#101736;
 border:2px solid #2a3568;box-shadow:0 8px 40px rgba(94,231,255,.12);touch-action:none;cursor:crosshair;}
.colors{display:flex;gap:10px;}
.dot{width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer;}
.dot.sel{border-color:#fff;transform:scale(1.12);}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
.btn{border:none;border-radius:999px;padding:13px 26px;font-size:16px;font-weight:700;color:#06121f;cursor:pointer;
 background:linear-gradient(135deg,var(--accent),#7dffcb);}
.btn.ghost{background:#222b58;color:#dfe6ff;}
.btn.big{font-size:19px;padding:15px 44px;}
#nameInput{background:#101736;border:2px solid #2a3568;color:#fff;border-radius:12px;padding:11px 14px;font-size:16px;width:min(84vw,340px);text-align:center;outline:none;}
#nameInput:focus{border-color:var(--accent);}
.hint{font-size:12px;color:#8b96c4;margin:0;text-align:center;}
#gameScreen{padding:0;justify-content:flex-start;}
#gameCanvas{position:absolute;inset:0;width:100%;height:100%;}
#hud{position:absolute;top:calc(10px + env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:5;}
.hudBox{background:rgba(8,22,55,.55);border:2px solid rgba(255,255,255,.35);backdrop-filter:blur(6px);border-radius:16px;padding:8px 14px;font-size:14px;line-height:1.5;box-shadow:0 4px 14px rgba(0,25,70,.28);}
.hudBox b{font-size:22px;color:#ffd93b;font-weight:900;}
.hudBox span{color:#fff;font-weight:700;}
#hudTier{font-size:11px;font-weight:900;letter-spacing:2px;color:#7dffcb;margin-top:2px;}
#hudCombo{color:#ff9a5e;font-weight:900;font-size:15px;margin-top:2px;animation:comboPulse .5s ease infinite alternate;}
@keyframes comboPulse{from{transform:scale(1);}to{transform:scale(1.12);}}
.hudBestLine{font-size:11px;color:#9aa7d0;margin-top:2px;}
#toast{position:absolute;top:32%;width:100%;text-align:center;font-size:30px;font-weight:800;color:#7dffcb;text-shadow:0 3px 12px rgba(0,0,0,.4);pointer-events:none;opacity:0;transition:opacity .3s;z-index:5;}
#toast.show{opacity:1;}
#tapHint{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;
 font-size:14px;font-weight:700;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.55);pointer-events:none;z-index:6;opacity:.9;}
#overScreen{background:rgba(6,10,28,.72);backdrop-filter:blur(8px);z-index:20;}
.card{background:var(--panel);border:1px solid #2a3568;border-radius:22px;padding:28px 30px;text-align:center;max-width:86vw;box-shadow:0 20px 60px rgba(0,0,0,.5);}
.card h2{margin:0 0 6px;font-size:30px;}
.card .big{font-size:46px;font-weight:900;color:var(--accent);margin:6px 0;}
.card p{color:#9aa7d0;margin:6px 0 16px;}
.stat{display:flex;gap:26px;justify-content:center;margin-bottom:18px;}
.stat div{font-size:13px;color:#9aa7d0;}
.stat b{display:block;font-size:24px;color:#fff;}
#cutoutStatus{color:#7dffcb;}
#cutoutScreen{justify-content:center;}
#cutCanvas{border-radius:14px;border:2px solid #2a3568;touch-action:none;max-width:94vw;}
#cutTools{align-items:center;}
#cutTools .btn.tool-on{background:linear-gradient(135deg,#ff6ec7,#ff9a5e);color:#fff;}
#brushSize{width:110px;accent-color:#ff6ec7;}
</style>
</head>
<body>

<!-- 画板 -->
<div class="screen" id="drawScreen">
  <h1 class="title">涂鸦滑雪<span class="en">SKETCHY SKIER</span></h1>
  <p class="sub">画出你的滑手，或上传照片、亲手抠出人物和滑板 🏂</p>
  <canvas id="drawCanvas"></canvas>
  <div class="colors" id="colorRow"></div>
  <div class="row">
    <button class="btn ghost" id="undoBtn">↩ 撤销</button>
    <button class="btn ghost" id="uploadBtn">📷 上传照片</button>
    <button class="btn ghost" id="clearBtn">🗑 清空</button>
  </div>
  <div class="row" id="photoRow" hidden>
    <button class="btn ghost" id="removePhotoBtn">✕ 移除照片</button>
  </div>
  <p class="hint" id="cutoutStatus" hidden></p>
  <input type="file" id="fileInput" accept="image/*" hidden />
  <input id="nameInput" maxlength="12" placeholder="给滑手起个名字" />
  <button class="btn big" id="startBtn">开滑！⛷️</button>
  <p class="hint">轻点屏幕起跳，跳台后有大片滞空区，空中按住转圈、松手即停，脚先落地才算数</p>
</div>

<!-- 抠图 -->
<div class="screen" id="cutoutScreen" hidden>
  <div class="row" id="cutTools">
    <button class="btn ghost tool-on" id="paintBtn">🖌️ 涂抹</button>
    <button class="btn ghost" id="eraseBtn">🧽 擦除</button>
    <input type="range" id="brushSize" min="8" max="90" value="34" />
  </div>
  <canvas id="cutCanvas"></canvas>
  <div class="row">
    <button class="btn ghost" id="cutUndoBtn">↩ 撤销</button>
    <button class="btn big" id="cutOkBtn">✅ 确认</button>
    <button class="btn ghost" id="cutCancelBtn">✕ 取消</button>
  </div>
  <p class="hint" id="cutHint">在人物和滑板上涂抹，亮起的部分会被保留为滑手</p>
</div>

<!-- 游戏 -->
<div class="screen" id="gameScreen" hidden>
  <canvas id="gameCanvas"></canvas>
  <div id="hud">
    <div class="hudBox"><span id="hudName">—</span><br><b><span id="hudDist">0</span></b> m · <b><span id="hudSpd">0</span></b> km/h<div id="hudTier">BEGINNER</div></div>
    <div class="hudBox" id="hudAirBox" hidden style="text-align:center">腾空<br><b><span id="hudAir">0.0</span></b> s</div>
    <div class="hudBox" style="text-align:right;min-width:120px">SCORE<br><b><span id="hudScore">0</span></b><div id="hudCombo" hidden>COMBO <span id="hudComboN">x2</span></div><div class="hudBestLine">BEST <span id="hudBestScore">0</span></div></div>
    <div style="position:fixed;right:8px;bottom:6px;color:#fff;opacity:.55;font-size:10px;z-index:30;pointer-events:none">V0.2</div>
  </div>
  <div id="toast"></div>
  <div id="tapHint">轻点起跳 · 空中按住转圈，松开即停，再按继续</div>
</div>

<!-- 结算 -->
<div class="screen" id="overScreen" hidden>
  <div class="card">
    <h2 id="overTitle">CRASH!</h2>
    <div style="font-size:13px;color:#9aa7d0;letter-spacing:3px">SCORE</div>
    <div class="big"><span id="overScore">0</span></div>
    <div class="stat">
      <div>BEST<b><span id="overBest">0</span></b></div>
      <div>BEST TRICK<b id="overTrick">—</b></div>
      <div>DISTANCE<b><span id="overDist">0</span> m</b></div>
    </div>
    <p id="overSub"></p>
    <div class="row">
      <button class="btn big" id="retryBtn">RETRY</button>
      <button class="btn ghost" id="redrawBtn">REDRAW RIDER</button>
    </div>
  </div>
</div>

<script>
'use strict';
const $ = id => document.getElementById(id);

/* ---------- 音效 ---------- */
let AC = null;
function initAudio(){
  if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(AC && AC.state==='suspended') AC.resume();
}
function beep(f0,f1,dur,type,vol){
  if(!AC) return;
  try{
    const o=AC.createOscillator(), g=AC.createGain();
    o.type=type||'sine';
    o.frequency.setValueAtTime(f0,AC.currentTime);
    o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),AC.currentTime+dur);
    g.gain.setValueAtTime(vol||.12,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+dur);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime+dur);
  }catch(e){}
}
const sfx={
  jump(){ beep(300,640,.18,'square',.07); },
  launch(){ beep(240,880,.3,'sawtooth',.06); },
  land(){ beep(180,90,.12,'triangle',.13); },
  perfect(){ beep(660,1320,.25,'sine',.11); },
  crash(){ beep(220,40,.4,'sawtooth',.15); },
  flip(){ beep(880,1174,.12,'sine',.08); },
  trick(i){ beep(660+i*130,990+i*130,.14,'sine',.09); },
  combo(){ beep(520,1560,.3,'triangle',.1); },
  tier(){ beep(440,660,.16,'triangle',.08); }
};
document.addEventListener('pointerdown', initAudio, {passive:true});
document.addEventListener('gesturestart', e=>e.preventDefault());
window.addEventListener('contextmenu', e=>{ if(e.target.closest && e.target.closest('#gameScreen')) e.preventDefault(); });

/* ---------- 画板 ---------- */
const DS = 320;
const DC = $('drawCanvas'), dctx = DC.getContext('2d');
let strokes = [], curColor = '#ffffff';
const COLORS = ['#ffffff','#5ee7ff','#ff6ec7','#ffe45e','#7dffcb'];
const colorRow = $('colorRow');
COLORS.forEach((c,i)=>{
  const d=document.createElement('div');
  d.className='dot'+(i===0?' sel':''); d.style.background=c;
  d.onclick=()=>{ curColor=c; document.querySelectorAll('.dot').forEach(x=>x.classList.remove('sel')); d.classList.add('sel'); };
  colorRow.appendChild(d);
});
function sizeDraw(){
  const w = DC.clientWidth||300, dpr = Math.min(2, window.devicePixelRatio||1);
  DC.width = w*dpr; DC.height = w*dpr; redrawDraw();
}
function drawPos(e){
  const r = DC.getBoundingClientRect();
  return [(e.clientX-r.left)/r.width*DS, (e.clientY-r.top)/r.height*DS];
}
function paintStrokes(ctx,S){
  ctx.lineCap='round'; ctx.lineJoin='round';
  for(const s of strokes){
    ctx.strokeStyle=s.color; ctx.lineWidth=s.w*S; ctx.beginPath();
    s.pts.forEach((p,i)=> i?ctx.lineTo(p[0]*S,p[1]*S):ctx.moveTo(p[0]*S,p[1]*S));
    ctx.stroke();
  }
}
let photoImg=null; // 抠图后的透明 canvas
function drawPhotoFit(ctx,S){
  if(!photoImg) return;
  const iw=photoImg.width, ih=photoImg.height;
  const sc=Math.min(DS/iw,DS/ih), w=iw*sc, h=ih*sc;
  ctx.drawImage(photoImg,(DS-w)/2*S,(DS-h)/2*S,w*S,h*S);
}
function redrawDraw(){
  const S = DC.width/DS;
  dctx.setTransform(1,0,0,1,0,0);
  dctx.fillStyle='#101736'; dctx.fillRect(0,0,DC.width,DC.height);
  drawPhotoFit(dctx,S);
  dctx.strokeStyle='rgba(255,255,255,.07)'; dctx.lineWidth=1;
  dctx.beginPath(); dctx.moveTo(DC.width/2,0); dctx.lineTo(DC.width/2,DC.height); dctx.stroke();
  dctx.beginPath(); dctx.moveTo(0,DC.height*0.84); dctx.lineTo(DC.width,DC.height*0.84); dctx.stroke();
  paintStrokes(dctx,S);
}
let drawing=false;
DC.addEventListener('pointerdown',e=>{
  e.preventDefault(); drawing=true;
  try{ DC.setPointerCapture(e.pointerId); }catch(_){}
  strokes.push({color:curColor,w:7,pts:[drawPos(e)]}); redrawDraw();
});
DC.addEventListener('pointermove',e=>{
  if(!drawing) return;
  const s=strokes[strokes.length-1], p=drawPos(e), l=s.pts[s.pts.length-1];
  if(Math.hypot(p[0]-l[0],p[1]-l[1])>2){ s.pts.push(p); redrawDraw(); }
});
['pointerup','pointercancel'].forEach(ev=>DC.addEventListener(ev,()=>{ drawing=false; }));
$('undoBtn').onclick=()=>{ strokes.pop(); redrawDraw(); };
$('clearBtn').onclick=()=>{ strokes=[]; redrawDraw(); };

function defaultSkier(){
  const Wc='#ffffff', Rc='#ff5e5e';
  const line=(c,w,pts)=>strokes.push({color:c,w,pts});
  const circle=(c,w,cx,cy,r)=>{ const p=[]; for(let i=0;i<=14;i++){ const a=i/14*Math.PI*2; p.push([cx+Math.cos(a)*r,cy+Math.sin(a)*r]); } line(c,w,p); };
  circle(Wc,7,160,78,30);
  line(Wc,7,[[160,112],[160,196]]);
  line(Wc,7,[[160,138],[116,166]]);
  line(Wc,7,[[160,138],[204,166]]);
  line(Wc,7,[[160,196],[128,252]]);
  line(Wc,7,[[160,196],[192,252]]);
  line(Rc,11,[[96,268],[224,268]]);
}

let sprite=null, playerName='';
function buildSprite(){
  const c=document.createElement('canvas'); c.width=DS; c.height=DS;
  const x2=c.getContext('2d');
  drawPhotoFit(x2,1);
  paintStrokes(x2,1); sprite=c;
}
function trimAlpha(img,w,h){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const x2=c.getContext('2d'); x2.drawImage(img,0,0);
  const d=x2.getImageData(0,0,w,h).data;
  let x0=w,y0=h,x1=-1,y1=-1;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    if(d[(y*w+x)*4+3]>12){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; }
  }
  if(x1<0) return c;
  const m=6;
  x0=Math.max(0,x0-m); y0=Math.max(0,y0-m); x1=Math.min(w-1,x1+m); y1=Math.min(h-1,y1+m);
  const t=document.createElement('canvas'); t.width=x1-x0+1; t.height=y1-y0+1;
  t.getContext('2d').drawImage(c,x0,y0,t.width,t.height,0,0,t.width,t.height);
  return t;
}
function savePhoto(){
  try{
    if(!photoImg){ localStorage.removeItem('sketchyskier_photo'); return; }
    const sc=Math.min(1,320/Math.max(photoImg.width,photoImg.height));
    const c=document.createElement('canvas');
    c.width=Math.max(1,Math.round(photoImg.width*sc)); c.height=Math.max(1,Math.round(photoImg.height*sc));
    c.getContext('2d').drawImage(photoImg,0,0,c.width,c.height);
    localStorage.setItem('sketchyskier_photo',c.toDataURL('image/png'));
  }catch(e){}
}
$('uploadBtn').onclick=()=>$('fileInput').click();
$('fileInput').addEventListener('change',async e=>{
  const f=e.target.files[0]; e.target.value='';
  if(!f) return;
  const st=$('cutoutStatus'); st.hidden=false;
  try{
    st.textContent='⏳ 读取照片…';
    let bmp;
    try{ bmp=await createImageBitmap(f,{imageOrientation:'from-image'}); }
    catch(_){ bmp=await createImageBitmap(f); }
    const sc=Math.min(1,1024/Math.max(bmp.width,bmp.height));
    const c=document.createElement('canvas');
    c.width=Math.round(bmp.width*sc); c.height=Math.round(bmp.height*sc);
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    if(bmp.close) bmp.close();
    // 已抠好的透明图：直接使用，跳过 AI
    const px=c.getContext('2d').getImageData(0,0,c.width,c.height).data;
    let tp=0; const pstep=4*7;
    for(let i=3;i<px.length;i+=pstep){ if(px[i]<128) tp++; }
    if(tp/(px.length/pstep)>0.005){
      photoImg=trimAlpha(c,c.width,c.height);
      savePhoto(); redrawDraw();
      $('photoRow').hidden=false;
      st.textContent='✅ 检测到透明背景，已直接使用！';
      setTimeout(()=>{ st.hidden=true; },2500);
      return;
    }
    st.hidden=true;
    openCutout(c); // 不透明照片 → 手动抠图
  }catch(err){
    console.warn('upload',err);
    st.textContent='❌ 读取照片失败，请换一张试试';
  }
});
$('removePhotoBtn').onclick=()=>{
  photoImg=null; savePhoto(); $('photoRow').hidden=true; redrawDraw();
};

/* ---------- 手动抠图 ---------- */
const CC=$('cutCanvas');
let cutSrcFull=null, cutMode='paint', maskStrokes=[], cutting=false;
const maskC=document.createElement('canvas'), dimC=document.createElement('canvas');
function setCutMode(m){
  cutMode=m;
  $('paintBtn').classList.toggle('tool-on',m==='paint');
  $('eraseBtn').classList.toggle('tool-on',m==='erase');
}
function openCutout(srcCanvas){
  cutSrcFull=srcCanvas;
  const availW=Math.min(window.innerWidth-24,560);
  const availH=window.innerHeight-300;
  const sc=Math.min(availW/srcCanvas.width,availH/srcCanvas.height,1);
  CC.width=Math.max(2,Math.round(srcCanvas.width*sc));
  CC.height=Math.max(2,Math.round(srcCanvas.height*sc));
  maskC.width=CC.width; maskC.height=CC.height;
  dimC.width=CC.width; dimC.height=CC.height;
  maskStrokes=[]; setCutMode('paint');
  $('cutHint').textContent='在人物和滑板上涂抹，亮起的部分会被保留为滑手';
  $('drawScreen').hidden=true; $('cutoutScreen').hidden=false;
  repaintCut();
}
function closeCutout(){
  $('cutoutScreen').hidden=true; $('drawScreen').hidden=false; sizeDraw();
}
function repaintCut(){
  const w=CC.width,h=CC.height,m=maskC.getContext('2d');
  m.setTransform(1,0,0,1,0,0);
  // 遮罩：透明底 + 白色笔触（destination-out 按透明度擦除，底必须是透明的）
  m.globalCompositeOperation='source-over';
  m.clearRect(0,0,w,h);
  m.lineCap='round'; m.lineJoin='round';
  for(const s of maskStrokes){
    m.globalCompositeOperation=s.erase?'destination-out':'source-over';
    m.strokeStyle='#fff'; m.lineWidth=s.w; m.beginPath();
    s.pts.forEach((p,i)=> i?m.lineTo(p[0],p[1]):m.moveTo(p[0],p[1]));
    m.stroke();
  }
  m.globalCompositeOperation='source-over';
  const g=CC.getContext('2d');
  g.setTransform(1,0,0,1,0,0);
  g.clearRect(0,0,w,h);
  g.drawImage(cutSrcFull,0,0,w,h);
  const dg=dimC.getContext('2d');
  dg.setTransform(1,0,0,1,0,0);
  dg.globalCompositeOperation='source-over';
  dg.clearRect(0,0,w,h);
  dg.fillStyle='rgba(5,8,25,.62)'; dg.fillRect(0,0,w,h);
  dg.globalCompositeOperation='destination-out';
  dg.drawImage(maskC,0,0);
  g.drawImage(dimC,0,0);
}
function cutPos(e){
  const r=CC.getBoundingClientRect();
  return [(e.clientX-r.left)/r.width*CC.width,(e.clientY-r.top)/r.height*CC.height];
}
CC.addEventListener('pointerdown',e=>{
  e.preventDefault(); cutting=true;
  try{ CC.setPointerCapture(e.pointerId); }catch(_){}
  maskStrokes.push({erase:cutMode==='erase',w:+$('brushSize').value,pts:[cutPos(e)]});
  repaintCut();
});
CC.addEventListener('pointermove',e=>{
  if(!cutting) return;
  const s=maskStrokes[maskStrokes.length-1],p=cutPos(e),l=s.pts[s.pts.length-1];
  if(Math.hypot(p[0]-l[0],p[1]-l[1])>2){ s.pts.push(p); repaintCut(); }
});
['pointerup','pointercancel'].forEach(ev=>CC.addEventListener(ev,()=>{ cutting=false; }));
$('paintBtn').onclick=()=>setCutMode('paint');
$('eraseBtn').onclick=()=>setCutMode('erase');
$('cutUndoBtn').onclick=()=>{ maskStrokes.pop(); repaintCut(); };
$('cutCancelBtn').onclick=closeCutout;
$('cutOkBtn').onclick=()=>{
  const d=maskC.getContext('2d').getImageData(0,0,maskC.width,maskC.height).data;
  let any=false;
  for(let i=0;i<d.length;i+=32){ if(d[i]>128){ any=true; break; } }
  if(!any){ $('cutHint').textContent='⚠️ 请先涂抹人物和滑板，再点确认'; return; }
  const sw=cutSrcFull.width,sh=cutSrcFull.height;
  const res=document.createElement('canvas'); res.width=sw; res.height=sh;
  const rg=res.getContext('2d');
  rg.drawImage(cutSrcFull,0,0);
  rg.globalCompositeOperation='destination-in';
  rg.drawImage(maskC,0,0,sw,sh);
  photoImg=trimAlpha(res,sw,sh);
  savePhoto(); $('photoRow').hidden=false; closeCutout();
  const st=$('cutoutStatus'); st.hidden=false; st.textContent='✅ 已保留你抠选的人物！';
  setTimeout(()=>{ st.hidden=true; },3000);
};
$('startBtn').onclick=()=>{

/* ---------- 游戏：场地 ---------- */
const GC=$('gameCanvas'), gx=GC.getContext('2d');
let W=0,H=0,DPR=1;
function sizeGame(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=window.innerWidth; H=window.innerHeight;
  GC.width=W*DPR; GC.height=H*DPR;
}
window.addEventListener('resize',()=>{ if(!$('gameScreen').hidden) sizeGame(); });

const METER=50, GRAV=490, MAXV=800; // 50px=1m，重力≈9.8m/s²
// 跳台按距离分级：越远越大、越密（BEGINNER/MOUNTAIN/EXTREME）
function tierAtM(m){ return m<500?0 : m<1500?1 : 2; }
const TIER_NAMES=['BEGINNER','MOUNTAIN','EXTREME'];
const TIER_CFG=[{len:110,slope:0.62,spacing:2600},{len:140,slope:0.72,spacing:2300},{len:170,slope:0.80,spacing:2000}];
const ramps=[];
{ let x=1500,i=0;
  while(x<170000){ const c=TIER_CFG[tierAtM(x/METER)]; ramps.push({x,len:c.len,slope:c.slope}); x+=c.spacing+((i*7919)%600); i++; } }
// 转体里程碑：[度数, 基础分]
const TRICK_MS=[[180,100],[360,300],[540,500],[720,800],[900,1000],[1080,1300]];
const fmt=n=>Math.round(n).toLocaleString('en-US');

function baseY(x){ return 260 + x*0.22 + 30*Math.sin(x*0.006) + 18*Math.sin(x*0.017+1.7); }
function kickerLift(x){
  for(const r of ramps){
    if(x>r.x-r.len && x<r.x){ const t=(x-(r.x-r.len))/r.len; return -(r.slope*r.len/1.2)*Math.pow(t,1.2); }
  }
  return 0;
}
const GAP=1800, GAP_DEPTH=480;
function valleyDrop(x){
  for(const r of ramps){
    const x0=r.x;
    if(x>x0 && x<x0+GAP){ const t=(x-x0)/GAP; return GAP_DEPTH*Math.pow(Math.sin(Math.PI*t),0.8); }
  }
  return 0;
}
function groundY(x){ return baseY(x)+kickerLift(x)+valleyDrop(x); }
function slopeAt(x){ return (groundY(x+8)-groundY(x-8))/16; }

/* ---------- 游戏：状态 ---------- */
const G={ running:false };
let spinTimer=0, pressing=false;
function startRun(){
  Object.assign(G,{
    running:true, overShown:false,
    x:0, px:0, y:groundY(0), vx:300, vy:0,
    angle:0, tilt:0, airRot:0, flips:0,
    grounded:true, spinHeld:false, airT:0,
    crashed:false, crashT:0, headFirst:false,
    camX:-window.innerWidth*0.35, camY:groundY(0)-window.innerHeight*0.55, camOff:0.55,
    best:+(localStorage.getItem('sketchyskier_best')||0),
    bestScore:+(localStorage.getItem('sketchyskier_best_score')||0),
    score:0, combo:1, runBestTrick:0, tricksThisJump:0, nextMS:0,
    shake:0, stretch:0, tier:0
  });
  parts.length=0; trail.length=0; floaters.length=0; initSnow();
  $('hudName').textContent=playerName;
  $('hudBestScore').textContent=fmt(G.bestScore);
  $('hudDist').textContent='0'; $('hudScore').textContent='0';
  $('hudTier').textContent=TIER_NAMES[0]; $('hudCombo').hidden=true;
  hideToast();
}

function doJump(){
  if(!G.running||G.crashed||!G.grounded) return;
  G.grounded=false; G.vy=-320; G.airRot=0; G.flips=0; G.airT=0; G.nextMS=0; G.tricksThisJump=0;
  G.stretch=1;
  spray(G.x,G.y,10,260);
  addFloater({world:true,x:G.x,y:G.y-130,txt:'JUMP!',color:'#7dffcb',life:0.7});
  sfx.jump();
}

function crash(dev){
  G.crashed=true; G.crashT=0; G.headFirst=dev>135; G.vy=-260;
  G.spinHeld=false; clearTimeout(spinTimer);
  G.combo=1; // 摔倒清连击
  G.shake=14;
  addFloater({x:W/2,y:H*0.35,txt:'CRASH!',color:'#ff5e5e',life:1.4});
  spray(G.x,G.y,22,380);
  sfx.crash();
}

function step(dt){
  const prevX=G.x;
  if(G.stretch>0) G.stretch=Math.max(0,G.stretch-3.5*dt);
  if(G.shake>0) G.shake=Math.max(0,G.shake-46*dt);
  stepFloaters(dt);
  if(G.crashed){
    G.crashT+=dt;
    G.vy+=GRAV*dt; G.x+=G.vx*dt; G.y+=G.vy*dt; G.angle+=640*dt;
    const gy=groundY(G.x);
    if(G.y>gy){ G.y=gy; G.vy*=-0.35; }
    G.vx*=Math.max(0,1-3*dt);
    if(G.crashT>1.25) showOver();
    return;
  }
  if(G.grounded){
    G.x+=G.vx*dt;
    const gy=groundY(G.x);
    G.vy=(gy-G.y)/dt; G.y=gy;
    const s=slopeAt(G.x);
    G.vx+=(12+490*s)*dt; // 重力沿坡分量：陡则加速、缓则减速
    G.vx=Math.max(220,Math.min(MAXV,G.vx));
    for(const r of ramps){
      if(prevX<r.x && G.x>=r.x){
        G.grounded=false;
        G.vy=-G.vx*r.slope*0.98; // 沿唇边切线起跳：水平分量保持，垂直分量由唇边角度决定
        G.airRot=0; G.flips=0; G.airT=0; G.nextMS=0; G.tricksThisJump=0;
        if(pressing) G.spinHeld=true; // 地面按住不放直接飞出去：空中保持转圈
        G.stretch=0.8;
        sfx.launch();
        spray(G.x,G.y-20,6,240);
        break;
      }
    }
    const target=Math.max(-25,Math.min(25,Math.atan(s)*57.3));
    G.tilt+=(target-G.tilt)*Math.min(1,10*dt);
    G.angle=G.tilt;
  }else{
    G.vy+=GRAV*dt; G.x+=G.vx*dt; G.y+=G.vy*dt; G.airT+=dt;
    if(G.spinHeld){ G.angle+=500*dt; G.airRot+=500*dt; }
    const f=Math.floor(Math.abs(G.airRot)/360);
    if(f>G.flips) G.flips=f;
    // 转体里程碑
    const ar=Math.abs(G.airRot);
    while(G.nextMS<TRICK_MS.length && ar>=TRICK_MS[G.nextMS][0]){
      const deg=TRICK_MS[G.nextMS][0], pts=TRICK_MS[G.nextMS][1]*G.combo;
      G.score+=pts; G.tricksThisJump++;
      if(deg>G.runBestTrick) G.runBestTrick=deg;
      addFloater({world:true,x:G.x,y:G.y-160,txt:deg+'°',sub:'+'+fmt(pts),color:'#ffd93b',life:1.2});
      spray(G.x,G.y-46,8,200);
      sfx.trick(G.nextMS);
      G.nextMS++;
    }
    const gy=groundY(G.x);
    if(G.y>=gy && G.vy>0){
      const norm=((G.angle%360)+360)%360, dev=Math.min(norm,360-norm);
      if(dev<=45){
        G.grounded=true; G.y=gy; G.vx*=0.94;
        const perfect=dev<=16;
        if(perfect) G.vx=Math.min(MAXV,G.vx*1.12);
        const landPts=perfect?500:200, airPts=Math.round(G.airT*100);
        G.score+=landPts+airPts;
        let comboTxt=null;
        if(G.tricksThisJump>0){ G.combo=Math.min(99,G.combo+1); comboTxt='COMBO x'+G.combo; sfx.combo(); }
        spray(G.x,gy,perfect?22:12,perfect?380:280);
        G.shake=perfect?10:6;
        addFloater({x:W/2,y:H*0.30,txt:perfect?'PERFECT LANDING!':'GOOD LANDING',sub:'+'+fmt(landPts),color:perfect?'#ffd93b':'#7dffcb'});
        if(airPts>0) addFloater({x:W/2,y:H*0.30+66,txt:'AIR TIME '+G.airT.toFixed(1)+'s',sub:'+'+fmt(airPts),color:'#ffffff',life:1.0});
        if(comboTxt) addFloater({x:W/2,y:H*0.30+132,txt:comboTxt,color:'#ff9a5e',life:1.3});
        if(perfect) sfx.perfect(); else sfx.land();
        G.angle=0; G.tilt=0; G.airRot=0; G.vy=0; G.flips=0; G.nextMS=0; G.tricksThisJump=0;
      }else{
        crash(dev);
      }
    }
  }
  G.px=G.x;
}

/* ---------- 游戏：HUD / 结算 ---------- */
/* ---------- 漂浮得分弹窗 ---------- */
const GFONT='-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif';
const floaters=[];
function addFloater(o){
  floaters.push(Object.assign({t:0,life:1.15,vy:-52,world:false,x:0,y:0,txt:'',sub:'',color:'#ffd93b'},o));
  if(floaters.length>24) floaters.shift();
}
function stepFloaters(dt){
  for(let i=floaters.length-1;i>=0;i--){
    const f=floaters[i]; f.t+=dt; f.y+=f.vy*dt; f.vy*=Math.max(0,1-2*dt);
    if(f.t>=f.life) floaters.splice(i,1);
  }
}
function drawFloaters(){
  gx.textAlign='center'; gx.textBaseline='middle';
  for(const f of floaters){
    const a=1-Math.pow(f.t/f.life,2);
    if(a<=0) continue;
    const sx=f.world? f.x-G.camX : f.x, sy=f.world? f.y-G.camY : f.y;
    gx.globalAlpha=a;
    gx.font='italic 900 30px '+GFONT;
    gx.lineWidth=5; gx.strokeStyle='rgba(20,30,60,.85)';
    gx.strokeText(f.txt,sx,sy);
    gx.fillStyle=f.color; gx.fillText(f.txt,sx,sy);
    if(f.sub){
      gx.font='italic 900 22px '+GFONT; gx.lineWidth=4;
      gx.strokeText(f.sub,sx,sy+28);
      gx.fillStyle='#ffffff'; gx.fillText(f.sub,sx,sy+28);
    }
  }
  gx.globalAlpha=1;
}
let toastTimer=null;
function toast(t){
  const el=$('toast');
  el.textContent=t; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('show'),900);
}
function hideToast(){ $('toast').classList.remove('show'); }

function showOver(){
  if(G.overShown) return;
  G.overShown=true;
  const d=Math.floor(G.x/METER);
  if(d>G.best){ G.best=d; try{ localStorage.setItem('sketchyskier_best',d); }catch(e){} }
  if(G.score>G.bestScore){ G.bestScore=Math.round(G.score); try{ localStorage.setItem('sketchyskier_best_score',G.bestScore); }catch(e){} }
  $('overTitle').textContent='CRASH! 💥';
  $('overScore').textContent=fmt(G.score);
  $('overBest').textContent=fmt(G.bestScore);
  $('overTrick').textContent=G.runBestTrick>0? G.runBestTrick+'°' : '—';
  $('overDist').textContent=d;
  $('overSub').textContent = G.headFirst ? '头先着地，颈椎表示抗议' : '脚没站稳，下次看好角度再落地';
  setTimeout(()=>{ $('overScreen').hidden=false; },350);
}

/* ---------- 游戏：粒子 / 雪 / 刻滑痕 ---------- */
const parts=[];
function spray(wx,wy,n,spd){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, v=spd*(0.4+Math.random()*0.8);
    parts.push({x:wx,y:wy,vx:Math.cos(a)*v,vy:Math.sin(a)*v-spd*0.5,life:0.6+Math.random()*0.5,t:0,r:2+Math.random()*3.5});
  }
  if(parts.length>240) parts.splice(0,parts.length-240);
}
function stepParts(dt){
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i]; p.t+=dt;
    if(p.t>=p.life){ parts.splice(i,1); continue; }
    p.vy+=GRAV*0.7*dt; p.x+=p.vx*dt; p.y+=p.vy*dt;
  }
}
function drawParts(){
  for(const p of parts){
    const a=1-p.t/p.life;
    gx.fillStyle='rgba(255,255,255,'+(a*0.85).toFixed(2)+')';
    gx.beginPath(); gx.arc(p.x-G.camX,p.y-G.camY,p.r*(0.5+a*0.7),0,7); gx.fill();
  }
}
const snow=[];
function initSnow(){
  snow.length=0;
  for(let i=0;i<70;i++) snow.push({x:Math.random(),y:Math.random(),r:1+Math.random()*2.6,v:30+Math.random()*70,ph:Math.random()*7});
}
function drawSnow(dt){
  gx.fillStyle='#fff';
  for(const f of snow){
    f.y+=f.v*dt/H; f.ph+=dt; f.x+=Math.sin(f.ph)*0.0006;
    if(f.y>1){ f.y=0; f.x=Math.random(); }
    gx.globalAlpha=+(0.3+0.45*((f.r-1)/2.6)).toFixed(2);
    gx.beginPath(); gx.arc(f.x*W,f.y*H,f.r,0,7); gx.fill();
  }
  gx.globalAlpha=1;
}
const trail=[];
function stepTrail(dt){
  for(let i=trail.length-1;i>=0;i--){ trail[i].age+=dt; if(trail[i].age>1.4) trail.splice(i,1); }
  if(G.grounded&&!G.crashed&&G.running){
    const last=trail[trail.length-1];
    if(!last||Math.abs(G.x-last.x)>26){
      trail.push({x:G.x,y:groundY(G.x),age:0});
      if(trail.length>60) trail.shift();
    }
  }
}
function drawTrail(){
  gx.lineCap='round';
  for(let i=1;i<trail.length;i++){
    const a=trail[i],b=trail[i-1],al=0.5*(1-a.age/1.4);
    if(al<=0) continue;
    gx.strokeStyle='rgba(190,220,255,'+al.toFixed(2)+')';
    gx.lineWidth=Math.max(1,10*(1-a.age/2.5));
    gx.beginPath(); gx.moveTo(b.x-G.camX,b.y-G.camY+5); gx.lineTo(a.x-G.camX,a.y-G.camY+5); gx.stroke();
  }
}

/* ---------- 游戏：渲染 ---------- */
const bgImg=new Image(); let bgReady=false;
bgImg.onload=()=>{ bgReady=true; };
bgImg.src='bg.webp';
const PAR_MAX=140; // 背景视差最大偏移，照片预留该余量后永不露边
function drawPhotoBG(){
  const iw=bgImg.naturalWidth, ih=bgImg.naturalHeight;
  if(!iw||!ih) return;
  const px=Math.min(Math.max(G.camX*0.04,0),PAR_MAX);
  const py=Math.min(Math.max((G.camY+200)*0.06,0),PAR_MAX);
  const s=Math.max((W+PAR_MAX+2)/iw,(H+PAR_MAX+2)/ih); // 覆盖屏幕+视差余量
  const dw=iw*s, dh=ih*s;
  gx.drawImage(bgImg,-px,-py,dw,dh);
  // 卡通调色（贴合效果图）：顶部高饱和蓝天 + 右上太阳光晕
  const tg=gx.createLinearGradient(0,0,0,H*0.5);
  tg.addColorStop(0,'rgba(25,110,255,.30)'); tg.addColorStop(1,'rgba(25,110,255,0)');
  gx.fillStyle=tg; gx.fillRect(0,0,W,H*0.5);
  const sg=gx.createRadialGradient(W*0.84,H*0.10,10,W*0.84,H*0.10,H*0.30);
  sg.addColorStop(0,'rgba(255,250,220,.8)'); sg.addColorStop(0.25,'rgba(255,244,200,.32)'); sg.addColorStop(1,'rgba(255,244,200,0)');
  gx.fillStyle=sg; gx.fillRect(0,0,W,H*0.45);
}
/* ---------- 卡通松树（两侧视差，不挡玩法区） ---------- */
function hash1(n){ const s=Math.sin(n*127.1)*43758.5453; return s-Math.floor(s); }
function pine(sx,baseY,s,shade){
  gx.fillStyle='#6b4a2f';
  gx.fillRect(sx-3*s,baseY-16*s,6*s,16*s);
  const cols=shade?['#2a6e8f','#337f9f','#3b90ad']:['#1e7a4c','#27945e','#32b06d'];
  for(let i=0;i<3;i++){
    const w=(36-i*9)*s, y0=baseY-12*s-i*24*s, h=32*s;
    gx.fillStyle=cols[i];
    gx.beginPath(); gx.moveTo(sx-w/2,y0); gx.lineTo(sx+w/2,y0); gx.lineTo(sx,y0-h); gx.closePath(); gx.fill();
    gx.fillStyle=shade?'rgba(220,235,245,.85)':'rgba(255,255,255,.92)';
    gx.beginPath(); gx.moveTo(sx-w*0.20,y0-h+2*s); gx.lineTo(sx+w*0.20,y0-h+2*s); gx.lineTo(sx,y0-h-9*s); gx.closePath(); gx.fill();
  }
}
function drawPinesFar(){ pinesLayer(0.10,560,0.55,0.9,true); }
function drawPinesNear(){ pinesLayer(0.22,420,0.9,1.5,false); }
function pinesLayer(par,spacing,sMin,sMax,shade){
  const off=G.camX*par, n0=Math.floor((off-200)/spacing), n1=Math.ceil((off+W+200)/spacing);
  for(let k=n0;k<=n1;k++){
    const sx=k*spacing-off;
    if(sx>W*0.24&&sx<W*0.76) continue;
    const s=sMin+hash1(k*3.7+par*91)*(sMax-sMin);
    const baseY=groundY(sx+G.camX)-G.camY;
    if(baseY<-80||baseY>H+120) continue;
    pine(sx,baseY+4,s,shade);
  }
}
function updateCam(dt){
  const k=Math.min(1,7*dt);
  G.camX+=((G.x-W*0.35)-G.camX)*k;
  const offT=(G.grounded&&!G.crashed)?0.55:0.45; // 地面/空中取景偏移，平滑过渡防瞬移
  G.camOff+=(offT-G.camOff)*Math.min(1,3*dt);
  const ty=((G.grounded&&!G.crashed)?groundY(G.x):G.y)-H*G.camOff;
  G.camY+=(ty-G.camY)*k;
}
function updateHUD(){
  $('hudDist').textContent=Math.floor(G.x/METER);
  $('hudSpd').textContent=Math.round(Math.hypot(G.vx,G.vy)/METER*3.6);
  $('hudScore').textContent=fmt(G.score);
  const air=!G.grounded&&!G.crashed&&G.running&&!G.overShown;
  $('hudAirBox').hidden=!air;
  if(air) $('hudAir').textContent=G.airT.toFixed(1);
  const t=tierAtM(G.x/METER);
  if(t!==G.tier){
    G.tier=t; $('hudTier').textContent=TIER_NAMES[t];
    if(G.running&&!G.overShown){ toast('⛰ '+TIER_NAMES[t]); sfx.tier(); }
  }
  if(G.combo>1){ $('hudCombo').hidden=false; $('hudComboN').textContent='x'+G.combo; }
  else $('hudCombo').hidden=true;
}

function clouds(){
  gx.fillStyle='rgba(255,255,255,.85)';
  for(let i=0;i<6;i++){
    const wx=i*900+300, sx=wx-G.camX*0.15, sy=90+((i*167)%120);
    if(sx<-160||sx>W+160) continue;
    gx.beginPath();
    gx.ellipse(sx,sy,70,22,0,0,7);
    gx.ellipse(sx-45,sy+8,44,16,0,0,7);
    gx.ellipse(sx+48,sy+6,46,17,0,0,7);
    gx.fill();
  }
}
function ridge(par,color,baseY0,amp,seed){
  gx.fillStyle=color; gx.beginPath(); gx.moveTo(-4,H+4);
  const off=G.camX*par;
  for(let sx=-4;sx<=W+4;sx+=24){
    const wx=sx+off;
    const y=baseY0-Math.abs(Math.sin(wx*0.004+seed))*amp-Math.abs(Math.sin(wx*0.011+seed*2))*amp*0.4;
    gx.lineTo(sx,y);
  }
  gx.lineTo(W+4,H+4); gx.closePath(); gx.fill();
}
function drawSlope(){
  const g=gx.createLinearGradient(0,H*0.35,0,H);
  g.addColorStop(0,'#ffffff'); g.addColorStop(1,'#d9e8ff');
  gx.fillStyle=g; gx.beginPath(); gx.moveTo(-60,H+60);
  for(let sx=-60;sx<=W+60;sx+=14) gx.lineTo(sx, groundY(sx+G.camX)-G.camY);
  gx.lineTo(W+60,H+60); gx.closePath(); gx.fill();
  // 卡通雪面：亮边 + 淡蓝阴影线
  gx.lineCap='round';
  gx.strokeStyle='rgba(255,255,255,.95)'; gx.lineWidth=3; gx.beginPath();
  for(let sx=-60;sx<=W+60;sx+=14){
    const y=groundY(sx+G.camX)-G.camY;
    if(sx===-60) gx.moveTo(sx,y); else gx.lineTo(sx,y);
  }
  gx.stroke();
  gx.strokeStyle='rgba(130,170,235,.40)'; gx.lineWidth=8; gx.beginPath();
  for(let sx=-60;sx<=W+60;sx+=14){
    const y=groundY(sx+G.camX)-G.camY+11;
    if(sx===-60) gx.moveTo(sx,y); else gx.lineTo(sx,y);
  }
  gx.stroke();
  // 雪面闪点
  const t0=Date.now()/400;
  for(let k=0;k<40;k++){
    const wx=k*397+hash1(k*1.3)*200, sx=wx-G.camX;
    if(sx<-10||sx>W+10) continue;
    const sy=groundY(wx)-G.camY+14+hash1(k*7.7)*70;
    if(sy<0||sy>H) continue;
    const tw=Math.abs(Math.sin(t0+hash1(k*3.1)*6.28));
    gx.globalAlpha=0.2+0.6*tw;
    gx.fillStyle='#ffffff';
    const r=1+hash1(k*5.3)*1.6;
    gx.fillRect(sx-r,sy-r,r*2,r*2);
  }
  gx.globalAlpha=1;
}
/* ---------- 跳跃弧线（腾空时预测轨迹，效果图风格） ---------- */
function drawJumpArc(){
  if(G.grounded||G.crashed||!G.running||G.overShown) return;
  let x=G.x,y=G.y,vx=G.vx,vy=G.vy;
  const dt=1/30, pts=[[x,y]];
  for(let i=0;i<90;i++){
    vy+=GRAV*dt; x+=vx*dt; y+=vy*dt;
    pts.push([x,y]);
    if(y>=groundY(x)&&vy>0) break;
  }
  gx.lineCap='round'; gx.lineWidth=5;
  for(let i=1;i<pts.length;i++){
    const a=pts[i-1],b=pts[i],f=i/pts.length;
    gx.strokeStyle='rgba(255,255,255,'+(0.75*(1-f*0.6)).toFixed(2)+')';
    gx.beginPath();
    gx.moveTo(a[0]-G.camX,a[1]-G.camY);
    gx.lineTo(b[0]-G.camX,b[1]-G.camY);
    gx.stroke();
  }
  const l=pts[pts.length-1];
  gx.strokeStyle='rgba(255,255,255,.85)'; gx.lineWidth=3;
  gx.beginPath(); gx.ellipse(l[0]-G.camX,groundY(l[0])-G.camY,26,8,0,0,7); gx.stroke();
}
function drawRamps(){
  for(const r of ramps){
    const rx=r.x, LEN=r.len;
    const sx=rx-G.camX, x0=rx-LEN;
    if(sx<-LEN-40||sx>W+LEN+40) continue;
    gx.save();
    gx.beginPath();
    gx.moveTo(sx-LEN, groundY(x0)-G.camY);
    for(let x=x0;x<=rx;x+=8) gx.lineTo(x-G.camX, groundY(x)-G.camY);
    gx.lineTo(sx, groundY(rx)-G.camY+120);
    gx.lineTo(sx-LEN, groundY(x0)-G.camY+120);
    gx.closePath(); gx.clip();
    for(let i=0;i<12;i++){
      gx.fillStyle=i%2 ? '#ff5e5e' : '#ffffff';
      gx.fillRect(sx-LEN-12+i*16, -300, 9, H+700);
    }
    gx.restore();
    gx.strokeStyle='#c23b3b'; gx.lineWidth=3; gx.beginPath();
    gx.moveTo(sx-LEN, groundY(x0)-G.camY);
    for(let x=x0;x<=rx;x+=8) gx.lineTo(x-G.camX, groundY(x)-G.camY);
    gx.stroke();
    const fx=sx-4, fy=groundY(rx-4)-G.camY;
    gx.strokeStyle='#333'; gx.lineWidth=3;
    gx.beginPath(); gx.moveTo(fx,fy); gx.lineTo(fx,fy-48); gx.stroke();
    gx.fillStyle='#ff5e5e';
    gx.beginPath(); gx.moveTo(fx,fy-48); gx.lineTo(fx+28,fy-40); gx.lineTo(fx,fy-32); gx.closePath(); gx.fill();
  }
}
function drawSkier(){
  const sx=G.x-G.camX, sy=G.y-G.camY;
  const hgt=Math.max(0,groundY(G.x)-G.y);
  const shS=1+Math.min(1.6,hgt/380), shA=Math.max(0.04,0.2-hgt/2600);
  gx.fillStyle='rgba(30,50,90,'+shA.toFixed(3)+')';
  gx.beginPath(); gx.ellipse(sx, groundY(G.x)-G.camY+6, 34*shS, 8*shS, 0, 0, 7); gx.fill();
  const st=G.stretch||0;
  gx.save();
  gx.translate(sx, sy-46);
  gx.rotate(G.angle*Math.PI/180);
  gx.scale(1-0.16*st, 1+0.26*st);
  if(sprite) gx.drawImage(sprite,-46,-46,92,92);
  gx.restore();
  drawSpinMeter(sx, sy-46);
}

/* 转体指示环：角度进度 + 顺时针方向箭头 */
function drawSpinMeter(sx,sy){
  if(G.grounded||G.crashed||!G.running||G.overShown) return;
  const ar=Math.abs(G.airRot);
  if(ar<15) return;
  const R=80, frac=(ar%360)/360;
  gx.lineWidth=6; gx.lineCap='round';
  gx.strokeStyle='rgba(255,255,255,.28)';
  gx.beginPath(); gx.arc(sx,sy,R,0,Math.PI*2); gx.stroke();
  gx.strokeStyle='#ffd93b';
  gx.beginPath(); gx.arc(sx,sy,R,-Math.PI/2,-Math.PI/2+frac*Math.PI*2); gx.stroke();
  // 顺时针方向箭头（转圈方向 = G.angle 递增 = 屏幕顺时针）
  const a=-Math.PI/2+frac*Math.PI*2, ax=sx+R*Math.cos(a), ay=sy+R*Math.sin(a);
  gx.fillStyle='#ffd93b';
  gx.save(); gx.translate(ax,ay); gx.rotate(a+Math.PI);
  gx.beginPath(); gx.moveTo(0,-9); gx.lineTo(6,5); gx.lineTo(-6,5); gx.closePath(); gx.fill();
  gx.restore();
  // 已完成圈数
  const done=Math.floor(ar/360);
  if(done>0){
    gx.font='900 20px '+GFONT; gx.textAlign='center'; gx.textBaseline='middle';
    gx.lineWidth=4; gx.strokeStyle='rgba(20,30,60,.85)';
    gx.strokeText('x'+done,sx,sy-R-18);
    gx.fillStyle='#ffd93b'; gx.fillText('x'+done,sx,sy-R-18);
  }
}
function render(dt){
  const shx=(Math.random()-0.5)*(G.shake||0), shy=(Math.random()-0.5)*(G.shake||0);
  gx.setTransform(DPR,0,0,DPR,shx*DPR,shy*DPR);
  if(bgReady){ drawPhotoBG(); }
  else{
    const sky=gx.createLinearGradient(0,0,0,H);
    sky.addColorStop(0,'#5f9df7'); sky.addColorStop(.55,'#a9ccf7'); sky.addColorStop(1,'#e8f2ff');
    gx.fillStyle=sky; gx.fillRect(0,0,W,H);
  }
  drawPinesFar();
  drawSlope();
  drawTrail();
  drawRamps();
  drawJumpArc();
  drawSkier();
  drawFloaters();
  drawPinesNear();
  drawParts();
  drawSnow(dt||0.016);
}

/* ---------- 游戏：操控（单手：轻点起跳，按住转圈，松手即停；空中再按直接转） ---------- */
GC.addEventListener('pointerdown',e=>{
  e.preventDefault();
  pressing=true;
  const wasAirborne=!G.grounded; // 先记状态：doJump()会把grounded置false
  doJump();
  clearTimeout(spinTimer);
  if(wasAirborne&&!G.crashed&&G.running){
    G.spinHeld=true; // 空中按下立刻转：空中没有点跳动作，无需等180ms区分
  }else{
    spinTimer=setTimeout(()=>{ G.spinHeld=true; },180);
  }
});
['pointerup','pointercancel','pointerleave'].forEach(ev=>
  GC.addEventListener(ev,()=>{ pressing=false; clearTimeout(spinTimer); G.spinHeld=false; }));
['pointerup','pointercancel'].forEach(ev=>
  window.addEventListener(ev,()=>{ pressing=false; clearTimeout(spinTimer); G.spinHeld=false; }));
window.addEventListener('keydown',e=>{
  if($('gameScreen').hidden) return;
  if(e.code==='Space'){ e.preventDefault(); doJump(); }
  if(e.code==='KeyF'&&!e.repeat){ G.spinHeld=true; }
});
window.addEventListener('keyup',e=>{
  if(e.code==='KeyF'){ G.spinHeld=false; }
});
$('retryBtn').onclick=()=>{ $('overScreen').hidden=true; startRun(); };
$('redrawBtn').onclick=()=>{
  $('overScreen').hidden=true; $('gameScreen').hidden=true; $('drawScreen').hidden=false;
  sizeDraw();
};

/* ---------- 主循环 ---------- */
let lastT=0;
function loop(t){
  requestAnimationFrame(loop);
  if($('gameScreen').hidden) return;
  const dt=Math.min(0.033,((t-lastT)/1000)||0.016);
  lastT=t;
  if(G.running && !G.overShown){
    const n=2, h=dt/n;
    for(let i=0;i<n;i++) step(h);
  }
  stepParts(dt); stepTrail(dt);
  updateCam(dt);
  render(dt);
  updateHUD();
}

/* ---------- 启动 ---------- */
try{
  const s=localStorage.getItem('sketchyskier_doodle');
  if(s) strokes=JSON.parse(s);
  const n=localStorage.getItem('sketchyskier_name');
  if(n) $('nameInput').value=n;
  const p=localStorage.getItem('sketchyskier_photo');
  if(p){
    const im=new Image();
    im.onload=()=>{ photoImg=trimAlpha(im,im.naturalWidth,im.naturalHeight); $('photoRow').hidden=false; redrawDraw(); };
    im.src=p;
  }
}catch(e){}
sizeDraw();
window.addEventListener('resize',()=>{ if(!$('drawScreen').hidden) sizeDraw(); });
requestAnimationFrame(loop);
</script>
